# Dependabot Configuration for Sim4D
# Automated dependency updates with security-first approach

version: 2

updates:
  # ═══════════════════════════════════════════════════════════════════════════
  # NPM Dependencies — the WHOLE pnpm workspace, from the root
  #
  # ┌─────────────────────────────────────────────────────────────────────────┐
  # │ SINGLE-LOCKFILE WORKSPACE: declare npm updates for '/' ONLY.            │
  # │ Never add a per-app or per-package npm entry.                          │
  # └─────────────────────────────────────────────────────────────────────────┘
  #
  # /pnpm-lock.yaml is the only lockfile in this repo and it covers every member
  # of pnpm-workspace.yaml (apps/*, packages/*).
  #
  # Dependabot treats each configured `directory` as an independent project.
  # From a sub-directory it finds that directory's package.json and no lockfile
  # beside it, so it edits the manifest and never touches /pnpm-lock.yaml. The
  # resulting PR is unmergeable on arrival: every gate here begins with
  # `pnpm install --frozen-lockfile` (ci.yml, test.yml, e2e-tests.yml,
  # security-scan.yml, test-docker.yml, nightly-cli.yml) and dies with
  # ERR_PNPM_OUTDATED_LOCKFILE. No rebase can repair it — the config that
  # produced the PR is incapable of producing a lockfile.
  #
  # The root entry below updates the member manifests AND the lockfile in one
  # commit, which is the only shape that can go green here.
  # ═══════════════════════════════════════════════════════════════════════════

  # Root package.json + every apps/* and packages/* workspace member
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '02:00'
      timezone: 'UTC'
    open-pull-requests-limit: 10
    versioning-strategy: 'increase'

    # Security updates
    allow:
      - dependency-type: 'all'

    # Group updates
    groups:
      # Critical security updates (always separate PRs)
      security-critical:
        patterns:
          - '*'
        update-types:
          - 'security'

      # Production dependencies
      production-dependencies:
        dependency-type: 'production'
        update-types:
          - 'minor'
          - 'patch'

      # Development dependencies
      development-dependencies:
        dependency-type: 'development'
        update-types:
          - 'minor'
          - 'patch'

    # Commit message configuration
    commit-message:
      prefix: 'deps'
      prefix-development: 'deps-dev'
      include: 'scope'

    # Labels for PR categorization
    labels:
      - 'dependencies'
      - 'automated'

    # Reviewers (optional - uncomment and configure)
    # reviewers:
    #   - "security-team"

    # Assignees (optional - uncomment and configure)
    # assignees:
    #   - "lead-developer"

    # Ignore specific dependencies (if needed) — add an `ignore:` key here with
    # real rules when one is needed. It is deliberately absent rather than
    # present-and-empty, because a null `ignore:` is not a valid rule list.
    # Example:
    #   ignore:
    #     - dependency-name: "react"
    #       update-types: ["version-update:semver-major"]

  # ═══════════════════════════════════════════════════════════════════════════
  # GitHub Actions
  # ═══════════════════════════════════════════════════════════════════════════

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '05:00'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'ci'
      include: 'scope'
    labels:
      - 'ci/cd'
      - 'github-actions'
      - 'automated'

  # ═══════════════════════════════════════════════════════════════════════════
  # Docker
  # ═══════════════════════════════════════════════════════════════════════════

  - package-ecosystem: 'docker'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:00'
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'docker'
    labels:
      - 'docker'
      - 'infrastructure'
      - 'automated'
# ═══════════════════════════════════════════════════════════════════════════
# Dependabot Configuration Notes
# ═══════════════════════════════════════════════════════════════════════════
#
# Update Strategy:
# - Security updates: Always create separate PRs immediately
# - Production deps: Grouped by minor/patch, weekly on Monday
# - Dev deps: Grouped by minor/patch, weekly on Monday
# - GitHub Actions: Weekly updates for CI/CD security
# - Docker: Weekly base image updates
#
# Security-First Approach:
# 1. Critical security updates bypass grouping (separate PRs)
# 2. All security patches applied immediately
# 3. Weekly schedule ensures regular security hygiene
# 4. Major version updates require manual review
#
# PR Management:
# - Max 10 root dependency PRs
# - Max 5 PRs per package to prevent overwhelming the team
# - Labeled for easy filtering and review
# - Commit messages follow Conventional Commits
#
# Customization:
# - Uncomment reviewers/assignees sections to auto-assign
# - Add to ignore list for packages requiring manual control
# - Adjust schedules if weekly updates are too frequent
#
# Integration with CI/CD:
# - All Dependabot PRs run through security-scan.yml workflow
# - PRs blocked if security vulnerabilities detected
# - Automated testing ensures updates don't break functionality
#
