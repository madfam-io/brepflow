apiVersion: apps/v1
kind: Deployment
metadata:
  name: sim4d-studio
  namespace: sim4d
  labels:
    app: sim4d-studio
    app.kubernetes.io/name: sim4d-studio
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: sim4d
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sim4d-studio
  template:
    metadata:
      labels:
        app: sim4d-studio
        app.kubernetes.io/name: sim4d-studio
        app.kubernetes.io/part-of: sim4d
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: ghcr-credentials
      containers:
        - name: studio
          image: ghcr.io/madfam-org/sim4d-studio@sha256:749e1a6b9ac6e150eb17b9127dd9d48c5cdd3b5cbdb35c9b9c7042c9755e2fc8
          ports:
            - containerPort: 5173
          envFrom:
            - secretRef:
                name: sim4d-secrets
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            runAsNonRoot: true
            capabilities:
              drop: [ALL]
          startupProbe:
            httpGet:
              path: /
              port: 5173
            initialDelaySeconds: 3
            periodSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /
              port: 5173
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 5173
            periodSeconds: 30
            timeoutSeconds: 5
          volumeMounts:
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
      volumes:
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
